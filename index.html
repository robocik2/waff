<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Eye</title>
<style>
  :root {
    --page-bg: #FFFFFF;            /* page background – change to match your overlay */
    --eye-max-width: 900px;     /* max width of the eye on large screens */
    --inside-size: 100%;         /* width of eyeinside.png relative to the eye */
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--page-bg);
    overflow: hidden;
  }

  body {
    display: grid;
    place-items: center;
  }

  .eye {
    position: relative;
    width: min(92vw, var(--eye-max-width));
    overflow: hidden;           /* inside layer never spills outside the eye box */
    user-select: none;
    -webkit-user-select: none;
  }

  /* Top layer: defines the eye shape (should be PNG with transparent eye opening).
     It sets the height of the container. */
  .overlay {
    position: relative;
    z-index: 2;
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }

  /* Bottom layer: eye insides, moved with JS */
  .inside {
    position: absolute;
    z-index: 1;
    top: 50%;
    left: 50%;
    width: var(--inside-size);
    height: auto;
    transform: translate(-50%, -50%);
    will-change: transform;
    pointer-events: none;
  }
</style>
</head>
<body>

  <div class="eye" id="eye">
    <img class="inside"  id="inside"  src="eyeinside.png" alt="">
    <img class="overlay" src="overlay_eye.png" alt="Eye">
  </div>

<script>
(() => {
  /* ---------- Settings ---------- */
  const MAX_X = 0.20;        // max horizontal travel, as fraction of eye width
  const MAX_Y = 0.10;        // max vertical travel, as fraction of eye height
  const FOLLOW_SMOOTHING = 0.12; // 0–1, lower = softer/slower follow

  // Intro: ease-in-out sweep. Values are -1 (full left) … 1 (full right)
  const INTRO_SWEEP = [
    { to:  1, duration: 800 },   // centre → right
    { to: -1, duration: 1100 },  // right → left
    { to:  0, duration: 800 }    // left → centre
  ];
  const INTRO_AMPLITUDE = 0.75;  // fraction of max horizontal travel used in the intro

  /* ---------- Setup ---------- */
  const eye = document.getElementById('eye');
  const inside = document.getElementById('inside');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let x = 0, y = 0;            // current offset (px)
  let targetX = 0, targetY = 0;
  let introDone = reduceMotion;

  const easeInOut = t => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  function render() {
    inside.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  }

  /* ---------- Intro (left–right easing) ---------- */
  function runIntro(done) {
    let step = 0;
    let from = 0;
    let start = null;

    function frame(now) {
      if (start === null) start = now;
      const { to, duration } = INTRO_SWEEP[step];
      const t = Math.min((now - start) / duration, 1);
      const value = from + (to - from) * easeInOut(t);

      const rect = eye.getBoundingClientRect();
      x = value * INTRO_AMPLITUDE * MAX_X * rect.width;
      render();

      if (t < 1) {
        requestAnimationFrame(frame);
      } else if (++step < INTRO_SWEEP.length) {
        from = to;
        start = null;
        requestAnimationFrame(frame);
      } else {
        done();
      }
    }
    requestAnimationFrame(frame);
  }

  /* ---------- Cursor following ---------- */
  function setTargetFromPoint(clientX, clientY) {
    const rect = eye.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;

    // Normalised -1…1 relative to the viewport, measured from the eye's centre
    const nx = Math.max(-1, Math.min(1, (clientX - cx) / (window.innerWidth / 2)));
    const ny = Math.max(-1, Math.min(1, (clientY - cy) / (window.innerHeight / 2)));

    targetX = nx * MAX_X * rect.width;
    targetY = ny * MAX_Y * rect.height;
  }

  window.addEventListener('pointermove', e => setTargetFromPoint(e.clientX, e.clientY));
  window.addEventListener('pointerdown', e => setTargetFromPoint(e.clientX, e.clientY));
  window.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; });

  function follow() {
    if (introDone) {
      x += (targetX - x) * FOLLOW_SMOOTHING;
      y += (targetY - y) * FOLLOW_SMOOTHING;
      render();
    }
    requestAnimationFrame(follow);
  }

  /* ---------- Start ---------- */
  function start() {
    render();
    requestAnimationFrame(follow);
    if (introDone) return;
    runIntro(() => { introDone = true; });
  }

  // Wait for the images so the eye is measured correctly
  const imgs = [...document.images];
  Promise.all(imgs.map(img => img.decode ? img.decode().catch(() => {}) : Promise.resolve()))
    .then(start);
})();
</script>
</body>
</html>
